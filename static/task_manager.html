<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VSU Robotics Club – Task Manager</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    /* small tab styles */
    .tabs { display:flex; gap:8px; margin:8px 0 12px }
    .tab { padding:8px 12px; border:1px solid var(--border); background:#fff; border-radius:999px; cursor:pointer; font-weight:700 }
    .tab[aria-selected="true"]{ background:#0B4EA2; color:#fff; border-color:#0B4EA2 }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">VSU Robotics Club</a>
    <nav class="nav-right">
      <span id="session_timer" class="timer-pill" title="Next deadline">--:--</span>
      <a href="logout.html" class="btn btn-blue" style="color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none;">Logout</a>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="banner">Task Manager</h1>

    <section class="grid">
      <!-- LEFT -->
      <div class="stack">
        <article class="card">
          <h2 class="card-title">Admin / Team Lead</h2>
          <ul class="list" id="admins_list"></ul>
        </article>

        <article class="card">
          <h2 class="card-title">Team</h2>
          <ul class="list" id="members_list"></ul>
        </article>
      </div>

      <!-- RIGHT -->
      <div class="stack">
        <article class="card">
          <h2 class="card-title">Tasks</h2>
          <div class="tabs">
            <button class="tab" id="tabAll"  aria-selected="true">All</button>
            <button class="tab" id="tabLate" aria-selected="false">Late</button>
          </div>
          <ul class="list" id="tasks_list"></ul>
        </article>
      </div>
    </section>
  </main>

  <script>
  // ---- minimal demo wiring; replace fetch() URLs with your API ----
  const tasks_list = document.getElementById('tasks_list');
  const tabAll  = document.getElementById('tabAll');
  const tabLate = document.getElementById('tabLate');

  // Example shape from your API (replace with fetch('/tasks?...'))
  let tasks = []; // fill from backend

  function render(list){
    tasks_list.innerHTML = '';
    list.forEach(t => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700">${t.title}</div>
            <div class="muted">${t.due ? 'Due: ' + new Date(t.due).toLocaleString() : ''}</div>
          </div>
          ${t.is_late ? '<span class="pill" style="background:#fee2e2;color:#991b1b;border-color:#fecaca">Late</span>' : ''}
        </div>`;
      tasks_list.appendChild(li);
    });
  }

  function onlyLate(ts){
    const now = Date.now();
    return ts.filter(t => t.due && new Date(t.due).getTime() < now && !t.is_completed)
             .map(t => ({...t, is_late:true}));
  }

  function selectTab(which){
    const isLate = which === 'late';
    tabAll.setAttribute('aria-selected', (!isLate).toString());
    tabLate.setAttribute('aria-selected', (isLate).toString());
    render(isLate ? onlyLate(tasks) : tasks);
  }

  tabAll.addEventListener('click', ()=>selectTab('all'));
  tabLate.addEventListener('click', ()=>selectTab('late'));

  // initial load (replace with real fetch)
  (async function bootstrap(){
    // TODO: tasks = await (await fetch('/tasks?project_id=...')).json();
    tasks = [
      {id:1,title:'Calibrate drivetrain',due:'2026-05-10T17:00:00Z',is_completed:true},
      {id:2,title:'Assemble arm',due:'2026-02-01T17:00:00Z',is_completed:false},
      {id:3,title:'Write system spec',due:'2026-04-02T23:59:59Z',is_completed:false}
    ];
    selectTab('all');
  })();
  </script>

  <!-- keep your deadline timer script here if you’re using it -->
</body>
</html>
