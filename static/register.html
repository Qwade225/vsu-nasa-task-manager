<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VSU task manager – Register</title>
  <style>
    :root{
      --orange:#F26623; --blue:#0B4EA2; --ink:#0f172a; --muted:#6b7280;
      --border:#e5e7eb; --bg:#fafafa;
      --logo:url("/app/img/vsu-logo.png"); /* adjust if your file name differs */
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
    header{padding:22px 0 8px;border-bottom:3px solid var(--orange);
      background:linear-gradient(#fff,rgba(255,255,255,.92))}
    h1{margin:0 auto;text-align:center;max-width:840px}
    .container{max-width:840px;margin:36px auto;padding:0 16px;position:relative}
    .logo-mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
      opacity:.06;background-image:var(--logo);background-repeat:no-repeat;background-position:center;background-size:460px}
    .card{position:relative;margin:auto;background:#fff;border:1px solid var(--border);
      border-radius:16px;padding:18px 18px 24px;box-shadow:0 4px 24px rgba(0,0,0,.05);max-width:720px}
    .circlogo{width:90px;height:90px;border-radius:50%;border:3px solid var(--blue);
      background:#fff;background-image:var(--logo);background-size:90px;background-position:center;background-repeat:no-repeat;margin:-62px auto 6px}
    .row{display:flex;gap:10px;margin:8px 0}
    input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px}
    .btn{width:100%;padding:11px 12px;border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer}
    .btn-orange{background:var(--orange)}
    .btn-blue{background:var(--blue)}
    .ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
    a.link{color:var(--blue);text-decoration:underline}
    .muted{color:var(--muted);font-size:.92rem}
    pre{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto}
  </style>
</head>
<body>
<header><h1>Create Your VSU Task Manager Account</h1></header>


<div class="container">
  <div class="logo-mark"></div>

  <div class="card">
    <div class="circlogo"></div>
 <h3>Register</h3>

<!-- START form -->
<form id="registerForm">
  <div class="row"><input id="r_username" placeholder="username" autocomplete="username"></div>
  <div class="row"><input id="r_email" placeholder="email (optional)" type="email" autocomplete="email"></div>
  <div class="row"><input id="r_password" placeholder="password" type="password" autocomplete="new-password"></div>
  <div class="row"><input id="r_password2" placeholder="confirm password" type="password" autocomplete="new-password"></div>

  

  <div class="row"> </div>

    <button type="submit" class="btn btn-orange">Create account</button>
  </div>
</form>
<!-- END form -->

<div class="row">
  <a class="btn btn-blue" href="./login.html" id="btnBackLogin">Back to login</a>
</div>

<pre id="r_out" class="muted"></pre>
  </div>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000/api";

  // Back link
  document.getElementById("btnBackLogin")?.addEventListener("click", e=>{
    e.preventDefault();
    window.location.href = "./login.html";
  });

  // Handle form
  document.getElementById("registerForm")?.addEventListener("submit", async e=>{
    e.preventDefault();
    const username = document.getElementById("r_username").value.trim();
    const email    = document.getElementById("r_email").value.trim();
    const pw1      = document.getElementById("r_password").value;
    const pw2      = document.getElementById("r_password2").value;

    if(!username || !pw1){ alert("Username and password required."); return; }
    if(pw1 !== pw2){ alert("Passwords do not match."); return; }

    try {
      // Register
      let res = await fetch(`${API_BASE}/auth/register`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, email, password: pw1 })
      });
      let data = await res.json();
      if(!res.ok) throw new Error(data.detail || "Register failed");

      // Auto-login
      res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password: pw1 })
      });
      data = await res.json();
      if(!res.ok) throw new Error(data.detail || "Auto-login failed");

      // Save session + go
      localStorage.setItem("ttoken", data.access_token);
      localStorage.setItem("tuser", data.username);
      localStorage.setItem("trole", data.role);

      window.location.href = "./task_manager.html";
    } catch(err){
      alert(err.message);
    }
  });
</script>
</html>
