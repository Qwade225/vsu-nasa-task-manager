<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Team C – Small Robotics Team</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    .tabs { display:flex; gap:8px; margin:8px 0 12px }
    .tab { padding:8px 12px; border:1px solid var(--border); background:#fff; border-radius:999px; cursor:pointer; font-weight:700 }
    .tab[aria-selected="true"]{ background:#0B4EA2; color:#fff; border-color:#0B4EA2 }
    .danger-pill{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:999px;padding:3px 8px;font-weight:700}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">VSU Robotics Club</a>
    <nav class="nav-right">
      <span id="session_timer" class="timer-pill">--:--</span>
      <a href="logout.html" class="btn btn-blue" style="color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none;">Logout</a>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="banner">Team C — Small Robotics Team</h1>

    <section class="grid">
      <!-- LEFT: Admin / Team Lead controls -->
      <div class="stack">
        <article class="card">
          <h2 class="card-title">Admin / Team Lead</h2>

          <!-- Add Task -->
          <div class="row">
            <input id="task_title" placeholder="new task title" />
            <input id="task_due" type="datetime-local" />
            <button class="btn btn-orange" id="btnAddTask">Add Task</button>
          </div>

          <!-- Add / Remove Users -->
          <div class="row">
            <input id="user_name" placeholder="username or email" />
            <button class="btn ghost" id="btnAddUser">Add User</button>
            <button class="btn ghost" id="btnRemoveUser">Remove User</button>
          </div>

          <!-- Existing tasks (with delete) -->
          <ul class="list" id="admin_tasks"></ul>
        </article>

        <!-- Team list -->
        <article class="card">
          <h2 class="card-title">Team</h2>
          <ul class="list" id="team_list"></ul>
        </article>
      </div>

      <!-- RIGHT: Tasks with tabs -->
      <div class="stack">
        <article class="card">
          <h2 class="card-title">Tasks</h2>
          <div class="tabs">
            <button class="tab" id="tabAll"  aria-selected="true">All</button>
            <button class="tab" id="tabLate" aria-selected="false">Late</button>
          </div>
          <ul class="list" id="tasks_list"></ul>
        </article>
      </div>
    </section>
  </main>

  <script>
  // ====== CONFIG ======
  const TEAM_ID = 3; // Team C id in your DB (change if different)
  const token = localStorage.getItem('access_token') || "";
  const authed = (init={}) => ({
    ...init,
    headers: {'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{})}
  });

  // ====== ELEMENTS ======
  const tasksEl = document.getElementById('tasks_list');
  const adminTasksEl = document.getElementById('admin_tasks');
  const teamEl = document.getElementById('team_list');
  const tabAll  = document.getElementById('tabAll');
  const tabLate = document.getElementById('tabLate');

  // ====== STATE ======
  let tasks = []; // [{id,title,due,is_completed}]
  let members = []; // [{id,username,role}]

  // ====== RENDER ======
  function renderTasks(list, target){
    target.innerHTML = '';
    list.forEach(t=>{
      const li = document.createElement('li');
      const late = t.due && new Date(t.due).getTime() < Date.now() && !t.is_completed;
      li.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div>
            <div style="font-weight:700">${t.title}</div>
            <div class="muted">${t.due ? 'Due: '+ new Date(t.due).toLocaleString() : ''}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            ${late ? '<span class="danger-pill">Late</span>' : ''}
            <button class="btn ghost" data-del="${t.id}">Delete</button>
          </div>
        </div>`;
      target.appendChild(li);
    });
    // bind delete
    target.querySelectorAll('button[data-del]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-del');
        // await fetch(`/tasks/${id}`, authed({method:'DELETE'}));
        tasks = tasks.filter(t=> String(t.id)!==String(id));
        selectTab(currentTab);
        renderTasks(tasks, adminTasksEl);
      });
    });
  }

  function renderMembers(){
    teamEl.innerHTML = '';
    members.forEach(m=>{
      const li = document.createElement('li');
      li.textContent = `${m.username} — ${m.role||'MEMBER'}`;
      teamEl.appendChild(li);
    });
  }

  function onlyLate(ts){
    return ts.filter(t => t.due && new Date(t.due).getTime() < Date.now() && !t.is_completed);
  }

  let currentTab = 'all';
  function selectTab(which){
    currentTab = which;
    const isLate = which==='late';
    tabAll.setAttribute('aria-selected', (!isLate).toString());
    tabLate.setAttribute('aria-selected', (isLate).toString());
    renderTasks(isLate ? onlyLate(tasks) : tasks, tasksEl);
  }

  tabAll.addEventListener('click', ()=>selectTab('all'));
  tabLate.addEventListener('click', ()=>selectTab('late'));

  // ====== ACTIONS ======
  document.getElementById('btnAddTask').addEventListener('click', async ()=>{
    const title = document.getElementById('task_title').value.trim();
    const due   = document.getElementById('task_due').value || null;
    if(!title){ alert('Enter a task title'); return; }
    // const res = await fetch('/tasks', authed({method:'POST', body: JSON.stringify({title, project_id: /*...*/, column_id:null})}));
    // const task = await res.json();
    const id = Math.floor(Math.random()*100000);
    const task = {id, title, due: due? new Date(due).toISOString(): null, is_completed:false};
    tasks.push(task);
    renderTasks(tasks, adminTasksEl);
    selectTab(currentTab);
    document.getElementById('task_title').value = '';
    document.getElementById('task_due').value = '';
  });

  document.getElementById('btnAddUser').addEventListener('click', async ()=>{
    const who = document.getElementById('user_name').value.trim();
    if(!who){ alert('Enter username or email'); return; }
    // await fetch(`/teams/${TEAM_ID}/members`, authed({method:'POST', body:JSON.stringify({user_id: /* id from lookup */, role:'MEMBER'})}));
    members.push({id:Math.random(), username:who, role:'MEMBER'});
    renderMembers();
    document.getElementById('user_name').value = '';
  });

  document.getElementById('btnRemoveUser').addEventListener('click', async ()=>{
    const who = document.getElementById('user_name').value.trim().toLowerCase();
    if(!who){ alert('Enter username or email'); return; }
    // await fetch(`/teams/${TEAM_ID}/members`, {method:'DELETE', ...});
    members = members.filter(m => (m.username||'').toLowerCase() !== who);
    renderMembers();
    document.getElementById('user_name').value = '';
  });

  // ====== LOAD ======
  (async function bootstrap(){
    // const tRes = await fetch(`/tasks?project_id=...`, authed());
    // tasks = await tRes.json();
    tasks = [
      {id:1,title:'Assemble microbot chassis',due:'2026-02-01T17:00:00Z',is_completed:false},
      {id:2,title:'Wire motor driver',due:'2026-04-10T17:00:00Z',is_completed:false},
      {id:3,title:'Program line-following',due:null,is_completed:false},
    ];

    // const mRes = await fetch(`/teams/${TEAM_ID}/members`, authed());
    // members = await mRes.json();
    members = [{id:11,username:'teamc_lead',role:'LEAD'},{id:12,username:'member01',role:'MEMBER'}];

    renderMembers();
    renderTasks(tasks, adminTasksEl);  // admin view with delete buttons
    selectTab('all');
  })();
  </script>

  <!-- (optional) include your deadline timer script here -->
</body>
</html>
